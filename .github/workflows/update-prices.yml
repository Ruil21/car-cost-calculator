name: Update prices

on:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC, when pump prices change
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run update-prices
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/sources/portugal.json src/data/prices.json
          git diff --cached --quiet || git commit -m "Update fuel prices"
          git push
